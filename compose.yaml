services:
  postgres:
    image: postgres:18.6
    container_name: docuflow-postgres
    environment:
      POSTGRES_DB: docuflow
      POSTGRES_USER: docuflow
      POSTGRES_PASSWORD: docuflow
    ports:
      - "5433:5432"
    volumes:
      - docuflow-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docuflow -d docuflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - docuflow-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docuflow-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DB_URL: jdbc:postgresql://postgres:5432/docuflow
      DB_USERNAME: docuflow
      DB_PASSWORD: docuflow
    ports:
      - "8080:8080"
    networks:
      - docuflow-network

volumes:
  docuflow-postgres-data:

networks:
  docuflow-network:
    driver: bridge
